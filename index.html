<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谁来帮忙？</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f3ee; display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  header { margin: 12px 0 4px; font-size: 28px; color: #f5a623; min-height: 34px; letter-spacing: 2px; }
  #question { font-size: clamp(22px, 5vw, 36px); font-weight: bold; color: #3d3d3d; margin: 8px 16px; text-align: center; }
  #scene {
    position: relative; width: min(92vw, 720px); height: min(56vw, 360px);
    border-radius: 24px; overflow: hidden; border: 4px solid #3d3d3d;
    transition: background .6s;
  }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; border-top: 4px solid #3d3d3d; }
  .ground.road  { background: #9e9e9e; box-shadow: inset 0 6px 0 #fff; }
  .ground.grass { background: #9ccc65; }
  .ground.water { background: #4fc3f7; box-shadow: inset 0 8px 0 #b3e5fc; }
  .ground.rail  { background: #bcaaa4; box-shadow: inset 0 10px 0 #757575; }
  .ground.pad   { background: #b0bec5; }
  .ground.soil  { background: #a1887f; box-shadow: inset 0 8px 0 #8d6e63; }
  .ground.snow  { background: #fff; box-shadow: inset 0 8px 0 #e3f2fd; }
  .ground.sand  { background: #ffe082; }
  .actor { position: absolute; transition: all 1.2s ease; }
  .actor svg, .card svg { width: 100%; height: auto; display: block; overflow: visible; }
  #place   { left: 6%;  bottom: 18%; width: 28%; }
  #problem { left: 24%; bottom: 20%; width: 17%; animation: wobble 1s infinite alternate; }
  #fx      { left: 22%; bottom: 30%; width: 20%; opacity: 0; }
  #after   { left: 24%; bottom: 20%; width: 17%; opacity: 0; transform: scale(0); }
  #hero    { left: 110%; bottom: 10%; width: 36%; }
  #scene.reset .actor { transition: none; }
  #scene.win #hero    { left: 50%; }
  #scene.win .wheel   { animation: spin .3s linear 4; }
  #scene.win #fx      { animation: fxshow 1.6s 1.1s forwards; }
  #scene.win #problem { opacity: 0; transform: scale(0); transition-delay: 1.8s; animation: none; }
  #scene.win #after   { opacity: 1; transform: scale(1); transition-delay: 2.6s; }
  #scene.win #after svg { animation: hop .5s 3.8s infinite alternate; }
  .wheel, .rotor, .flame { transform-box: fill-box; transform-origin: center; }
  .rotor { animation: rotor .2s linear infinite alternate; }
  .flame { transform-origin: left center; animation: flame .15s infinite alternate; }
  #confetti { position: absolute; inset: 0; pointer-events: none; }
  #confetti span { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 2s linear forwards; }

  #choices { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
  .card {
    width: min(28vw, 180px); aspect-ratio: 1; border: 4px solid #3d3d3d; border-radius: 28px; padding: 12px;
    background: #fff; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 0 #3d3d3d; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .card small { font-size: 18px; color: #3d3d3d; font-weight: bold; margin-top: 6px; }
  .card:active { transform: translateY(6px); box-shadow: 0 2px 0 #3d3d3d; }
  .card.wrong { animation: shake .4s; background: #ffcdd2; }
  .card:disabled { opacity: .5; }
  #next {
    display: none; font-size: 28px; padding: 14px 40px; border: 4px solid #3d3d3d; border-radius: 40px; font-family: inherit;
    background: #81c784; color: #3d3d3d; font-weight: bold; box-shadow: 0 6px 0 #3d3d3d; cursor: pointer;
    animation: pulse .6s infinite alternate;
  }
  @keyframes wobble { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(6deg) scale(1.08); } }
  @keyframes pulse  { from { transform: scale(1); } to { transform: scale(1.12); } }
  @keyframes shake  { 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  @keyframes fall   { to { transform: translateY(420px) rotate(540deg); } }
  @keyframes spin   { to { transform: rotate(-360deg); } }
  @keyframes rotor  { to { transform: scaleX(.15); } }
  @keyframes flame  { to { transform: scaleX(1.35); } }
  @keyframes fxshow { 0%, 100% { opacity: 0; transform: scale(.8); } 15%, 45%, 75% { opacity: 1; transform: scale(1.1); } 30%, 60% { opacity: 1; transform: scale(.95); } }
  @keyframes hop    { to { transform: translateY(-10%); } }
</style>
</head>
<body>
<header id="stars"></header>
<div id="question"></div>
<div id="scene">
  <svg id="bg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid slice" stroke="#3d3d3d" stroke-width="3">
    <g id="day">
      <circle cx="640" cy="60" r="34" fill="#ffe082"/>
      <path d="M380 76 Q376 50 404 52 Q412 30 440 38 Q466 34 468 58 Q490 62 484 78Z" fill="#fff"/>
      <path d="M170 110 Q166 90 188 92 Q196 74 218 82 Q240 80 238 98 Q254 102 250 114Z" fill="#fff"/>
    </g>
    <g id="night" stroke="none" fill="#fff59d">
      <path d="M640 30 A40 40 0 1 0 680 90 A32 32 0 1 1 640 30Z" stroke="#3d3d3d"/>
      <circle cx="120" cy="40" r="4"/><circle cx="260" cy="80" r="3"/><circle cx="380" cy="30" r="4"/>
      <circle cx="500" cy="110" r="3"/><circle cx="560" cy="40" r="3"/><circle cx="60" cy="130" r="3"/>
    </g>
    <g id="sea" fill="#e1f5fe" stroke-width="2">
      <circle cx="120" cy="60" r="10"/><circle cx="140" cy="100" r="6"/><circle cx="420" cy="40" r="8"/>
      <circle cx="440" cy="80" r="5"/><circle cx="620" cy="120" r="9"/><circle cx="300" cy="140" r="5"/>
    </g>
    <g id="flakes" fill="#fff" stroke-width="2">
      <circle cx="60" cy="40" r="6"/><circle cx="200" cy="30" r="5"/><circle cx="300" cy="90" r="6"/>
      <circle cx="520" cy="50" r="5"/><circle cx="560" cy="140" r="6"/><circle cx="100" cy="150" r="5"/>
    </g>
  </svg>
  <div class="ground" id="ground"></div>
  <div class="actor" id="place"></div>
  <div class="actor" id="problem"></div>
  <div class="actor" id="fx"></div>
  <div class="actor" id="after"></div>
  <div class="actor" id="hero"></div>
  <div id="confetti"></div>
</div>
<div id="choices"></div>
<button id="next">下一个 ▶</button>

<script src="art.js"></script>
<script src="vehicles.js"></script>
<script src="levels.js"></script>
<script src="sound.js"></script>
<script>
// ===== 游戏逻辑 =====
const COLORS = ['#ef5350', '#ffd54f', '#81c784', '#42a5f5', '#f06292', '#ffb74d'];
const $ = id => document.getElementById(id);
let order = [], idx = 0, stars = 0;

function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.3;
  speechSynthesis.speak(u);
}

const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

function load() {
  if (idx >= order.length) { order = shuffle(SCENES); idx = 0; }
  const s = order[idx];
  const scene = $('scene');
  scene.className = 'reset'; void scene.offsetWidth; // 切场景时不播放倒退动画
  scene.className = '';
  scene.style.background = s.sky;
  const bg = s.bg || 'day'; // day | night | sea | snow
  $('day').style.display = bg === 'day' || bg === 'snow' ? '' : 'none';
  $('night').style.display = bg === 'night' ? '' : 'none';
  $('sea').style.display = bg === 'sea' ? '' : 'none';
  $('flakes').style.display = bg === 'snow' ? '' : 'none';
  $('ground').className = 'ground ' + s.ground;
  // high：问题在高处（比如树上的小猫）
  $('problem').style.bottom = $('after').style.bottom = s.high ? '50%' : '';
  $('fx').style.bottom = s.high ? '56%' : '';
  $('place').innerHTML = PLACES[s.place];
  $('problem').innerHTML = PROBLEMS[s.problem];
  $('fx').innerHTML = FX[s.fx];
  $('after').innerHTML = AFTERS[s.after];
  $('hero').innerHTML = VEHICLES[s.answer].art;
  $('hero').style.bottom = (VEHICLES[s.answer].y ?? 10) + '%';
  $('confetti').innerHTML = '';
  $('question').textContent = s.q;
  $('next').style.display = 'none';

  const pool = Object.keys(VEHICLES).filter(v => v !== s.answer && !(s.avoid || []).includes(v));
  $('choices').innerHTML = '';
  for (const v of shuffle([s.answer, ...shuffle(pool).slice(0, 2)])) {
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `${VEHICLES[v].art}<small>${VEHICLES[v].name}</small>`;
    b.onclick = () => pick(b, v, s);
    $('choices').appendChild(b);
  }
  say(s.q);
}

function pick(btn, v, s) {
  if (v !== s.answer) {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    say(`${VEHICLES[v].name}不对哦，再想想！`);
    return;
  }
  document.querySelectorAll('.card').forEach(b => b.disabled = true);
  $('scene').classList.add('win');
  speechSynthesis?.cancel();
  playSound(VEHICLES[v].sound);
  stars++; $('stars').textContent = '★'.repeat(stars % 10 || 10);
  setTimeout(() => {
    say(s.win);
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('span');
      c.style.background = COLORS[i % COLORS.length];
      c.style.left = Math.random() * 100 + '%';
      c.style.animationDelay = Math.random() * .8 + 's';
      $('confetti').appendChild(c);
    }
    $('next').style.display = 'block';
  }, 2800);
}

$('next').onclick = () => { idx++; load(); };

// 首次需要点击才能播放语音（浏览器限制）
$('question').textContent = '点我开始！';
$('question').style.cursor = 'pointer';
document.body.addEventListener('click', function start() {
  $('question').style.cursor = '';
  order = shuffle(SCENES); load();
}, { once: true });
</script>
</body>
</html>
