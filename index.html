<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>谁来帮忙？</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f3ee; display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  header { margin: 12px 0 4px; font-size: 28px; color: #f5a623; min-height: 34px; letter-spacing: 2px; }
  #question { font-size: clamp(22px, 5vw, 36px); font-weight: bold; color: #3d3d3d; margin: 8px 16px; text-align: center; }
  #scene {
    position: relative; width: min(92vw, 720px); height: min(56vw, 360px);
    border-radius: 24px; overflow: hidden; border: 4px solid #3d3d3d;
    transition: background .6s;
  }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scene .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; border-top: 4px solid #3d3d3d; }
  .ground.road  { background: #9e9e9e; box-shadow: inset 0 6px 0 #fff; }
  .ground.grass { background: #9ccc65; }
  .ground.water { background: #4fc3f7; box-shadow: inset 0 8px 0 #b3e5fc; }
  .ground.rail  { background: #bcaaa4; box-shadow: inset 0 10px 0 #757575; }
  .ground.pad   { background: #b0bec5; }
  .actor { position: absolute; transition: all 1.2s ease; }
  .actor svg, .card svg { width: 100%; height: auto; display: block; overflow: visible; }
  #place   { left: 6%;  bottom: 18%; width: 28%; }
  #problem { left: 24%; bottom: 20%; width: 17%; animation: wobble 1s infinite alternate; }
  #fx      { left: 22%; bottom: 30%; width: 20%; opacity: 0; }
  #after   { left: 24%; bottom: 20%; width: 17%; opacity: 0; transform: scale(0); }
  #hero    { left: 110%; bottom: 10%; width: 36%; }
  #scene.reset .actor { transition: none; }
  #scene.win #hero    { left: 50%; }
  #scene.win .wheel   { animation: spin .3s linear 4; }
  #scene.win #fx      { animation: fxshow 1.6s 1.1s forwards; }
  #scene.win #problem { opacity: 0; transform: scale(0); transition-delay: 1.8s; animation: none; }
  #scene.win #after   { opacity: 1; transform: scale(1); transition-delay: 2.6s; }
  #scene.win #after svg { animation: hop .5s 3.8s infinite alternate; }
  .wheel, .rotor, .flame { transform-box: fill-box; transform-origin: center; }
  .rotor { animation: rotor .2s linear infinite alternate; }
  .flame { transform-origin: left center; animation: flame .15s infinite alternate; }
  #confetti { position: absolute; inset: 0; pointer-events: none; }
  #confetti span { position: absolute; top: -20px; width: 12px; height: 16px; border-radius: 3px; animation: fall 2s linear forwards; }

  #choices { display: flex; gap: 16px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
  .card {
    width: min(28vw, 180px); aspect-ratio: 1; border: 4px solid #3d3d3d; border-radius: 28px; padding: 12px;
    background: #fff; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 0 #3d3d3d; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .card small { font-size: 18px; color: #3d3d3d; font-weight: bold; margin-top: 6px; }
  .card:active { transform: translateY(6px); box-shadow: 0 2px 0 #3d3d3d; }
  .card.wrong { animation: shake .4s; background: #ffcdd2; }
  .card:disabled { opacity: .5; }
  #next {
    display: none; font-size: 28px; padding: 14px 40px; border: 4px solid #3d3d3d; border-radius: 40px; font-family: inherit;
    background: #81c784; color: #3d3d3d; font-weight: bold; box-shadow: 0 6px 0 #3d3d3d; cursor: pointer;
    animation: pulse .6s infinite alternate;
  }
  @keyframes wobble { from { transform: rotate(-6deg) scale(1); } to { transform: rotate(6deg) scale(1.08); } }
  @keyframes pulse  { from { transform: scale(1); } to { transform: scale(1.12); } }
  @keyframes shake  { 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  @keyframes fall   { to { transform: translateY(420px) rotate(540deg); } }
  @keyframes spin   { to { transform: rotate(-360deg); } }
  @keyframes rotor  { to { transform: scaleX(.15); } }
  @keyframes flame  { to { transform: scaleX(1.35); } }
  @keyframes fxshow { 0%, 100% { opacity: 0; transform: scale(.8); } 15%, 45%, 75% { opacity: 1; transform: scale(1.1); } 30%, 60% { opacity: 1; transform: scale(.95); } }
  @keyframes hop    { to { transform: translateY(-10%); } }
</style>
</head>
<body>
<header id="stars"></header>
<div id="question"></div>
<div id="scene">
  <svg id="bg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid slice" stroke="#3d3d3d" stroke-width="3">
    <g id="day">
      <circle cx="640" cy="60" r="34" fill="#ffe082"/>
      <path d="M380 76 Q376 50 404 52 Q412 30 440 38 Q466 34 468 58 Q490 62 484 78Z" fill="#fff"/>
      <path d="M170 110 Q166 90 188 92 Q196 74 218 82 Q240 80 238 98 Q254 102 250 114Z" fill="#fff"/>
    </g>
    <g id="night" stroke="none" fill="#fff59d">
      <path d="M640 30 A40 40 0 1 0 680 90 A32 32 0 1 1 640 30Z" stroke="#3d3d3d"/>
      <circle cx="120" cy="40" r="4"/><circle cx="260" cy="80" r="3"/><circle cx="380" cy="30" r="4"/>
      <circle cx="500" cy="110" r="3"/><circle cx="560" cy="40" r="3"/><circle cx="60" cy="130" r="3"/>
    </g>
  </svg>
  <div class="ground" id="ground"></div>
  <div class="actor" id="place"></div>
  <div class="actor" id="problem"></div>
  <div class="actor" id="fx"></div>
  <div class="actor" id="after"></div>
  <div class="actor" id="hero"></div>
  <div id="confetti"></div>
</div>
<div id="choices"></div>
<button id="next">下一个 ▶</button>

<script>
// ===== 卡通素材：粗描边 + 圆角 + 笑脸。车辆统一朝左（从右边开进场景） =====
const OUT = '#3d3d3d', GLASS = '#bfe6ff';
const svg = (vb, body, sw = 4) =>
  `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg"><g stroke="${OUT}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;
const label = (x, y, t, size = 12, fill = OUT) =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="bold" text-anchor="middle" fill="${fill}" stroke="none" font-family="PingFang SC, sans-serif">${t}</text>`;
const face = (cx, cy, s = 1, mood = 'happy') => {
  const mouth = mood === 'happy'
    ? `M${cx - 5 * s} ${cy + 5 * s} Q${cx} ${cy + 11 * s} ${cx + 5 * s} ${cy + 5 * s}`
    : `M${cx - 5 * s} ${cy + 10 * s} Q${cx} ${cy + 4 * s} ${cx + 5 * s} ${cy + 10 * s}`;
  return `<g stroke="none"><circle cx="${cx - 8 * s}" cy="${cy}" r="${3.2 * s}" fill="${OUT}"/><circle cx="${cx + 8 * s}" cy="${cy}" r="${3.2 * s}" fill="${OUT}"/>
    <ellipse cx="${cx - 15 * s}" cy="${cy + 6 * s}" rx="${4 * s}" ry="${2.5 * s}" fill="#ff8a80" opacity=".8"/><ellipse cx="${cx + 15 * s}" cy="${cy + 6 * s}" rx="${4 * s}" ry="${2.5 * s}" fill="#ff8a80" opacity=".8"/></g>
    <path d="${mouth}" fill="none" stroke-width="${2.5 * s}"/>`;
};
const wheel = (cx, cy = 104, r = 16) =>
  `<g class="wheel"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#4a4a4a"/><circle cx="${cx}" cy="${cy}" r="${r * .42}" fill="#e0e0e0" stroke-width="3"/><circle cx="${cx}" cy="${cy - r * .7}" r="2" fill="#e0e0e0" stroke="none"/></g>`;
const star = (cx, cy, r, fill) => {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * .5 : r;
    p.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`);
  }
  return `<polygon points="${p.join(' ')}" fill="${fill}"/>`;
};
const checker = (x, y, cols, rows, w, h) => Array.from({ length: cols * rows }, (_, i) =>
  (i % cols + Math.floor(i / cols)) % 2 ? '' : `<rect x="${x + (i % cols) * w}" y="${y + Math.floor(i / cols) * h}" width="${w}" height="${h}" fill="${OUT}" stroke="none"/>`).join('');

// 小轿车车身，警车/出租车/坏掉的车共用
const sedan = (color, extras = '', mood = 'happy') => svg('0 0 200 130', `
  <path d="M10 104 V82 Q10 66 28 64 L52 62 L70 38 Q74 34 80 34 H130 Q136 34 140 38 L160 62 L176 64 Q192 66 192 82 V104 Z" fill="${color}"/>
  <path d="M64 62 L78 44 H102 V62Z" fill="${GLASS}"/><path d="M110 62 V44 H132 L146 62Z" fill="${GLASS}"/>
  <circle cx="18" cy="76" r="5" fill="#fff59d" stroke-width="3"/>
  ${extras}${face(44, 76, 1.1, mood)}${wheel(52)}${wheel(150)}`);
// 卡车车头（朝左），多款卡车共用
const cab = (color, light = '') => `
  <path d="M10 104 V62 Q10 42 32 42 H70 V104Z" fill="${color}"/>
  <path d="M20 66 Q20 52 34 52 H58 V66Z" fill="${GLASS}"/>
  ${light ? `<rect x="28" y="32" width="20" height="10" rx="4" fill="${light}"/>` : ''}
  <circle cx="16" cy="84" r="4" fill="#fff59d" stroke-width="3"/>${face(40, 80, 1.1)}`;

const VEHICLES = {
  fire: { name: '消防车', art: svg('0 0 200 130', `
    <rect x="66" y="40" width="126" height="62" rx="10" fill="#ef5350"/>
    <rect x="84" y="52" width="42" height="32" rx="4" fill="#fff"/><path d="M92 62 H118 M92 72 H118" fill="none" stroke-width="3"/>
    <rect x="136" y="52" width="44" height="32" rx="4" fill="#ffcdd2"/>
    <path d="M92 34 V40 M170 34 V40" fill="none"/>
    <rect x="72" y="24" width="116" height="10" rx="3" fill="#fff"/>
    <path d="M88 24 V34 M104 24 V34 M120 24 V34 M136 24 V34 M152 24 V34 M168 24 V34" fill="none" stroke-width="3"/>
    ${cab('#e53935', '#42a5f5')}${wheel(44)}${wheel(156)}`) },
  ambulance: { name: '救护车', art: svg('0 0 200 130', `
    <rect x="64" y="22" width="128" height="80" rx="10" fill="#fff"/>
    <rect x="66" y="70" width="124" height="8" fill="#ef5350" stroke="none"/>
    <path d="M120 32 h14 v12 h12 v14 h-12 v12 h-14 v-12 h-12 v-14 h12z" fill="#ef5350"/>
    ${cab('#fff', '#ef5350')}${wheel(44)}${wheel(160)}`) },
  police: { name: '警车', art: sedan('#fff', `
    <rect x="62" y="80" width="128" height="12" fill="#1e88e5" stroke="none"/>${label(126, 90, 'POLICE', 10, '#fff')}
    <rect x="92" y="24" width="13" height="10" rx="3" fill="#ef5350"/><rect x="105" y="24" width="13" height="10" rx="3" fill="#42a5f5"/>`) },
  taxi: { name: '出租车', art: sedan('#ffd54f', `
    ${Array.from({ length: 12 }, (_, i) => i % 2 ? '' : `<rect x="${70 + i * 10}" y="82" width="10" height="8" fill="${OUT}" stroke="none"/>`).join('')}
    <rect x="88" y="22" width="34" height="12" rx="4" fill="#fff"/>${label(105, 31.5, 'TAXI', 9)}`) },
  bus: { name: '校车', art: svg('0 0 200 130', `
    <rect x="8" y="24" width="186" height="80" rx="20" fill="#ffd54f"/>
    <rect x="16" y="34" width="26" height="30" rx="6" fill="${GLASS}"/>
    ${[52, 86, 120, 154].map(x => `<rect x="${x}" y="34" width="28" height="26" rx="5" fill="${GLASS}"/>`).join('')}
    <rect x="10" y="70" width="182" height="6" fill="#ffb300" stroke="none"/>
    ${label(104, 98, '校车', 13)}${face(28, 84, 1.1)}${wheel(46)}${wheel(160)}`) },
  tractor: { name: '拖拉机', art: svg('0 0 200 130', `
    <rect x="98" y="14" width="74" height="10" rx="5" fill="#2e7d32"/>
    <rect x="106" y="24" width="56" height="40" rx="3" fill="${GLASS}"/>
    <path d="M14 104 V72 Q14 58 28 58 H172 V104Z" fill="#66bb6a"/>
    <rect x="44" y="30" width="8" height="28" rx="2" fill="#9e9e9e"/>
    <circle cx="20" cy="72" r="4" fill="#fff59d" stroke-width="3"/>${face(40, 80, 1.1)}
    ${wheel(146, 98, 28)}${wheel(44, 108, 14)}`) },
  truck: { name: '货车', art: svg('0 0 200 130', `
    <rect x="66" y="18" width="128" height="76" rx="8" fill="#ffe0b2"/>
    <path d="M110 36 h40 v40 h-40z M130 36 v14" fill="#ffb74d"/>
    <rect x="10" y="92" width="184" height="10" rx="3" fill="#9e9e9e"/>
    ${cab('#42a5f5')}${wheel(42)}${wheel(128)}${wheel(168)}`) },
  race: { name: '赛车', art: svg('0 0 200 130', `
    <rect x="174" y="40" width="24" height="10" rx="3" fill="#c62828"/><path d="M182 50 V72" fill="none"/>
    <path d="M6 104 Q4 80 30 78 L82 72 Q100 52 132 56 L152 70 H186 V104Z" fill="#ef5350"/>
    <circle cx="116" cy="56" r="11" fill="#ffd54f"/><rect x="107" y="53" width="14" height="6" rx="3" fill="${OUT}" stroke="none"/>
    <circle cx="98" cy="88" r="11" fill="#fff"/>${label(98, 93, '1', 14)}
    ${face(36, 88, 1)}${wheel(48, 106, 17)}${wheel(158, 106, 17)}`) },
  excavator: { name: '挖掘机', art: svg('0 0 200 130', `
    <rect x="62" y="98" width="130" height="26" rx="13" fill="#616161"/>
    ${[78, 104, 130, 156, 178].map(x => wheel(x, 111, 7)).join('')}
    <path d="M110 70 L68 20 L56 30 L96 78Z" fill="#ffb300"/>
    <path d="M62 24 L26 64 L36 72 L70 32Z" fill="#ffb300"/>
    <path d="M14 62 Q10 92 38 94 L42 70Z" fill="#9e9e9e"/>
    <rect x="76" y="62" width="110" height="36" rx="8" fill="#ffca28"/>
    <path d="M124 62 V28 Q124 18 134 18 H170 Q180 18 180 28 V62Z" fill="#ffca28"/>
    <rect x="132" y="26" width="40" height="28" rx="4" fill="${GLASS}"/>
    ${face(102, 76, 1.1)}`) },
  mixer: { name: '水泥车', art: svg('0 0 200 130', `
    <rect x="10" y="92" width="184" height="10" rx="3" fill="#9e9e9e"/>
    <g transform="rotate(-10 130 60)"><ellipse cx="130" cy="60" rx="58" ry="30" fill="#eceff1"/>
    <path d="M100 34 Q112 60 100 86 M130 30 Q142 60 130 90 M160 34 Q170 60 160 86" fill="none" stroke="#ffb300" stroke-width="7"/></g>
    <path d="M184 40 L198 32 L198 50Z" fill="#9e9e9e"/>
    ${cab('#ffca28')}${wheel(42)}${wheel(124)}${wheel(166)}`) },
  garbage: { name: '垃圾车', art: svg('0 0 200 130', `
    <path d="M66 24 H178 Q192 24 192 38 V100 H66Z" fill="#66bb6a"/>
    <rect x="68" y="76" width="122" height="8" fill="#fff" stroke="none"/>
    <path d="M114 40 H146 L142 66 H118Z" fill="#fff" stroke-width="3"/><rect x="110" y="34" width="40" height="6" rx="3" fill="#fff" stroke-width="3"/>
    <path d="M124 46 V60 M136 46 V60" fill="none" stroke-width="2"/>
    ${cab('#43a047', '#ffb300')}${wheel(44)}${wheel(160)}`) },
  tow: { name: '拖车', art: svg('0 0 200 130', `
    <path d="M150 76 L180 24" fill="none" stroke-width="12"/><path d="M150 76 L180 24" fill="none" stroke="#ffb300" stroke-width="5"/>
    <path d="M180 24 L188 28 V50" fill="none" stroke-width="3"/><path d="M188 50 q-8 0 -8 8 q0 6 6 6" fill="none" stroke-width="3"/>
    <rect x="66" y="74" width="128" height="26" rx="4" fill="#ff7043"/>
    ${cab('#ff8a65', '#ffb300')}${wheel(44)}${wheel(160)}`) },
  boat: { name: '轮船', y: 8, art: svg('0 0 200 130', `
    <rect x="128" y="6" width="14" height="24" rx="3" fill="#ef5350"/>
    <rect x="84" y="24" width="64" height="22" rx="6" fill="#fff"/>
    <rect x="58" y="44" width="110" height="30" rx="6" fill="#fff"/>
    ${[78, 100, 122, 144].map(x => `<circle cx="${x}" cy="59" r="6" fill="${GLASS}" stroke-width="3"/>`).join('')}
    <path d="M6 72 H196 L182 112 Q180 118 172 118 H34 Q26 118 22 112Z" fill="#42a5f5"/>
    <path d="M22 92 H188" fill="none" stroke="#fff" stroke-width="5"/>
    ${face(48, 84, 1.1)}`) },
  rocket: { name: '火箭', y: 40, art: svg('0 0 200 130', `
    <path class="flame" d="M164 46 Q204 64 164 82 Q180 64 164 46Z" fill="#ffa726"/>
    <path d="M118 36 L148 6 L160 36Z M118 92 L148 122 L160 92Z" fill="#ef5350"/>
    <rect x="150" y="42" width="16" height="44" rx="4" fill="#9e9e9e"/>
    <path d="M12 64 Q40 30 100 34 H152 V94 H100 Q40 98 12 64Z" fill="#fff"/>
    <path d="M12 64 Q28 42 56 37 V91 Q28 86 12 64Z" fill="#ef5350"/>
    <circle cx="96" cy="64" r="18" fill="${GLASS}"/>${face(96, 60, .9)}`) },
  helicopter: { name: '直升机', y: 42, art: svg('0 0 200 130', `
    <rect x="70" y="16" width="10" height="16" fill="#9e9e9e"/>
    <rect class="rotor" x="12" y="10" width="128" height="7" rx="3" fill="#757575"/>
    <path d="M126 56 H180 V70 H126Z" fill="#ef5350"/><rect class="rotor" x="176" y="40" width="8" height="40" rx="3" fill="#757575"/>
    <path d="M40 118 H124 M58 98 V118 M106 98 V118" fill="none"/>
    <path d="M18 70 Q18 32 64 32 H110 Q132 32 132 58 V78 Q132 98 110 98 H52 Q18 98 18 70Z" fill="#ef5350"/>
    <path d="M28 66 Q30 42 62 42 V66Z" fill="${GLASS}"/>
    <path d="M90 48 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 v-10 h10z" fill="#fff" stroke-width="3"/>
    ${face(46, 80, 1.1)}`) },
  train: { name: '火车', art: svg('0 0 200 130', `
    <g fill="#fff" stroke-width="3"><circle cx="58" cy="12" r="8"/><circle cx="74" cy="6" r="6"/></g>
    <path d="M42 52 V30 H36 V20 H64 V30 H58 V52Z" fill="#616161"/>
    <rect x="120" y="28" width="68" height="74" rx="6" fill="#5c6bc0"/>
    <rect x="114" y="18" width="80" height="12" rx="5" fill="#3949ab"/>
    <rect x="132" y="40" width="44" height="28" rx="4" fill="${GLASS}"/>
    <rect x="22" y="50" width="104" height="52" rx="22" fill="#7986cb"/>
    <path d="M6 112 L22 86 V112Z" fill="#ef5350"/>
    ${face(50, 72, 1.1)}${wheel(54, 106, 14)}${wheel(92, 106, 14)}${wheel(154, 102, 18)}`) },
  bike: { name: '自行车', art: svg('0 0 200 130', `
    <g class="wheel"><circle cx="48" cy="96" r="26" fill="#fff" stroke-width="6"/><circle cx="48" cy="96" r="4" fill="${OUT}"/></g>
    <g class="wheel"><circle cx="152" cy="96" r="26" fill="#fff" stroke-width="6"/><circle cx="152" cy="96" r="4" fill="${OUT}"/></g>
    <path d="M48 96 L80 50 M76 56 L132 56 L152 96 M76 56 L104 96 L132 56 M104 96 H48" fill="none" stroke-width="10"/>
    <path d="M48 96 L80 50 M76 56 L132 56 L152 96 M76 56 L104 96 L132 56 M104 96 H48" fill="none" stroke="#ffca28" stroke-width="5"/>
    <path d="M80 50 L74 32 H58" fill="none" stroke-width="5"/>
    <path d="M132 56 L136 42" fill="none" stroke-width="5"/><rect x="124" y="34" width="26" height="9" rx="4" fill="${OUT}"/>`) },
};

// 小朋友角色
function kid({ shirt = '#ff8a65', mood = 'happy', mask, cap, hardhat, helmet, bandage, backpack, bag, suitcase } = {}) {
  return svg('0 0 80 104', `
    ${backpack ? '<rect x="12" y="54" width="20" height="30" rx="6" fill="#ef5350"/>' : ''}
    <rect x="28" y="84" width="9" height="18" rx="4" fill="#546e7a"/><rect x="43" y="84" width="9" height="18" rx="4" fill="#546e7a"/>
    <rect x="22" y="54" width="36" height="34" rx="12" fill="${shirt}"/>
    ${mask ? '<path d="M24 64 H56 M24 74 H56" fill="none" stroke="#fff" stroke-width="4"/>' : ''}
    <circle cx="40" cy="32" r="22" fill="#ffd9b0"/>
    <path d="M18 30 Q20 8 40 9 Q60 8 62 30 Q52 18 40 20 Q28 18 18 30Z" fill="#6d4c41"/>
    ${face(40, 32, 1, mood)}
    ${mood === 'sad' ? '<path d="M30 36 q-3 7 0 9 q3 -2 0 -9Z M50 36 q-3 7 0 9 q3 -2 0 -9Z" fill="#4fc3f7" stroke-width="1.5"/>' : ''}
    ${mask ? '<rect x="16" y="24" width="48" height="13" rx="6" fill="#333"/><circle cx="32" cy="30" r="3.5" fill="#fff" stroke="none"/><circle cx="48" cy="30" r="3.5" fill="#fff" stroke="none"/>' : ''}
    ${cap ? '<path d="M16 20 Q40 -2 64 20Z" fill="#1565c0"/><rect x="14" y="18" width="52" height="6" rx="3" fill="#0d47a1"/>' + star(40, 11, 5, '#ffd54f') : ''}
    ${hardhat ? '<path d="M17 22 Q17 4 40 4 Q63 4 63 22Z" fill="#ffca28"/><rect x="12" y="20" width="56" height="6" rx="3" fill="#ffb300"/>' : ''}
    ${helmet ? `<circle cx="40" cy="32" r="28" fill="${GLASS}" opacity=".45"/>` : ''}
    ${bandage ? '<rect x="44" y="12" width="20" height="8" rx="3" fill="#ffe0b2" stroke-width="2" transform="rotate(25 54 16)"/>' : ''}
    ${bag ? `<circle cx="66" cy="76" r="12" fill="#bcaaa4"/>${label(66, 81, '$', 14, '#fff')}` : ''}
    ${suitcase ? '<path d="M62 66 V60 H72 V66" fill="none" stroke-width="3"/><rect x="56" y="66" width="22" height="26" rx="4" fill="#a1887f"/>' : ''}`, 3);

// ===== 游戏逻辑 =====
const COLORS = ['#ef5350', '#ffd54f', '#81c784', '#42a5f5', '#f06292', '#ffb74d'];
const $ = id => document.getElementById(id);
let order = [], idx = 0, stars = 0;

function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1.3;
  speechSynthesis.speak(u);
}

const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

function load() {
  if (idx >= order.length) { order = shuffle(SCENES); idx = 0; }
  const s = order[idx];
  const scene = $('scene');
  scene.className = 'reset'; void scene.offsetWidth; // 切场景时不播放倒退动画
  scene.className = '';
  scene.style.background = s.sky;
  $('day').style.display = s.night ? 'none' : '';
  $('night').style.display = s.night ? '' : 'none';
  $('ground').className = 'ground ' + s.ground;
  $('place').innerHTML = PLACES[s.place];
  $('problem').innerHTML = PROBLEMS[s.problem];
  $('fx').innerHTML = FX[s.fx];
  $('after').innerHTML = AFTERS[s.after];
  $('hero').innerHTML = VEHICLES[s.answer].art;
  $('hero').style.bottom = (VEHICLES[s.answer].y ?? 10) + '%';
  $('confetti').innerHTML = '';
  $('question').textContent = s.q;
  $('next').style.display = 'none';

  const pool = Object.keys(VEHICLES).filter(v => v !== s.answer && !(s.avoid || []).includes(v));
  $('choices').innerHTML = '';
  for (const v of shuffle([s.answer, ...shuffle(pool).slice(0, 2)])) {
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `${VEHICLES[v].art}<small>${VEHICLES[v].name}</small>`;
    b.onclick = () => pick(b, v, s);
    $('choices').appendChild(b);
  }
  say(s.q);
}

function pick(btn, v, s) {
  if (v !== s.answer) {
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    say(`${VEHICLES[v].name}不对哦，再想想！`);
    return;
  }
  document.querySelectorAll('.card').forEach(b => b.disabled = true);
  $('scene').classList.add('win');
  stars++; $('stars').textContent = '★'.repeat(stars % 10 || 10);
  setTimeout(() => {
    say(s.win);
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('span');
      c.style.background = COLORS[i % COLORS.length];
      c.style.left = Math.random() * 100 + '%';
      c.style.animationDelay = Math.random() * .8 + 's';
      $('confetti').appendChild(c);
    }
    $('next').style.display = 'block';
  }, 2800);
}

$('next').onclick = () => { idx++; load(); };

// 首次需要点击才能播放语音（浏览器限制）
$('question').textContent = '点我开始！';
$('question').style.cursor = 'pointer';
document.body.addEventListener('click', function start() {
  $('question').style.cursor = '';
  order = shuffle(SCENES); load();
}, { once: true });
</script>
